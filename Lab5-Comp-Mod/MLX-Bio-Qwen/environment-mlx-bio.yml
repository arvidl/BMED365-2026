name: mlx-bio
channels:
  - conda-forge
  - nodefaults
dependencies:
  # Core Python & Jupyter Stack
  - python=3.11
  - pip
  - jupyterlab
  - ipykernel
  - ipywidgets

  # Scientific Computing & Visualization (ARM64 Optimized)
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - matplotlib
  - seaborn

  # Computational Biology Toolkit
  - biopython
  - scanpy
  - anndata

  # Pip Dependencies (Apple MLX Framework)
  - pip:
      - mlx-lm>=0.19.0
      - huggingface_hub
      - mlx>=0.18.0
      